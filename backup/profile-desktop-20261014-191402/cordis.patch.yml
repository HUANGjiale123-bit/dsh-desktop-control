# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
- id: ui-chat
  name: "@deepseek-ai/dsh-client-ui-chat"
  config:
    transcriptView: standard
    performanceUsage: detailed
- id: ui-settings
  name: "@deepseek-ai/dsh-client-ui-settings"
  config:
    enabled: true
- id: ui-settings-account
  name: "@deepseek-ai/dsh-client-ui-settings-account"
  config:
    version: 1
    step: done
    usage: detailed
    developerTools: true
    purpose: null
    process: standard
    completion: api-key
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: deepseek-official
    model: deepseek-flash
    reasoningEffort: max
# Discover skills from disk so saved experience reaches every new session.
# Root order by rank: <cwd>/.dsh/skills, <cwd>/.agents/skills,
# <dshHome>/skills, <agentsHome>/skills. Layout: <name>/SKILL.md or flat <name>.md.
- id: skill-filesystem
  name: "@deepseek-ai/dsh-skill-filesystem"
  config:
    enabled: true
    dshHome: "C:\\Users\\a1838\\.dsh"
    agentsHome: "C:\\Users\\a1838\\.agents"
    includeDefaultRoots: true
# dsh-pilot 的 screenshotDir / downloadDir 默认是相对路径，会按宿主进程的
# cwd（= 本 profile 目录）解析，落回 C 盘。改成绝对路径，写到 D 盘工作区。
- id: pilot
  name: dsh-pilot
  config:
    screenshotDir: "D:\\dsh workspace\\.dsh-pilot"
    downloadDir: "D:\\dsh workspace\\.dsh-pilot\\downloads"
# 桌面操控插件。白名单默认为空——不显式放行，任何操作都会被拒绝，
# 只有观察类工具（列窗口 / 读树 / 截图）可用。
# 放行某个应用 = 允许助手在该应用内自由操作（对应 Codex 的会话白名单）。
- id: desktop-control
  name: dsh-desktop-control
  config:
    helperPath: "D:\\dsh workspace\\dsh-desktop-control\\helper\\bin\\dsc.exe"
    edgePath: "D:\\dsh workspace\\dsh-desktop-control\\helper\\bin\\dsc-edge.exe"
    shotDir: "D:\\dsh workspace\\dsh-desktop-control\\.cache\\shots"
    allowedApps:
      - notepad.exe
      - QQLive.exe
      - DoubleTarget.exe
- id: terminal-controller
  name: "@deepseek-ai/dsh-api-terminal-controller"
  config:
    shell:
      path: D:/Git/bin/bash.exe
      name: Git Bash
      args:
        - -i
